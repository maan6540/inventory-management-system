<div class="container-fluid px-4 py-4">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1">Users</h3>
      <p class="text-muted mb-0">Manage system users and their access.</p>
    </div>

    <button type="button" class="btn btn-primary" (click)="openModal()">
      <i class="bi bi-plus-lg me-2"></i>
      Add User
    </button>
  </div>

  <!-- Filters -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <!-- Search -->
        <div class="col-12 col-lg-5">
          <label class="form-label fw-semibold">Search</label>

          <div class="input-group">
            <span class="input-group-text bg-white">
              <i class="bi bi-search"></i>
            </span>

            <input
              type="text"
              class="form-control"
              placeholder="Search by "
              [(ngModel)]="searchText"
              (input)="onSearch()"
            />
          </div>
        </div>

        <!-- Department -->
        <div class="col-12 col-md-4 col-lg-2">
          <label class="form-label fw-semibold">Department</label>
          <app-dropdown
            [options]="departments"
            labelKey="departmentName"
            valueKey="departmentId"
            placeholder="All Departments"
            [selectedValue]="departmentId"
            (valueChange)="onDepartmentSelected($event)"
          >
          </app-dropdown>
        </div>

        <!-- Role -->
        <div class="col-12 col-md-4 col-lg-2">
          <label class="form-label fw-semibold">Role</label>
          <app-dropdown
            [options]="roles"
            labelKey="roleName"
            valueKey="roleId"
            placeholder="All Roles"
            [selectedValue]="roleId"
            (valueChange)="onRoleSelected($event)"
          ></app-dropdown>
        </div>

        <!-- Status -->
        <div class="col-12 col-md-4 col-lg-2">
          <label class="form-label fw-semibold">Status</label>
          <app-dropdown
            [options]="status"
            labelKey="statusName"
            valueKey="statusId"
            placeholder="All Status"
            [selectedValue]="statusId"
            (valueChange)="onStatusSelected($event)"
          ></app-dropdown>
        </div>

        <!-- Reset -->
        <div class="col-12 col-lg-1">
          <button type="button" class="btn btn-outline-secondary w-100" (click)="resetFilters()">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card border-0 shadow-sm position-relative">
    <app-loader [loading]="isLoadingUsers()" [fullscreen]="false"></app-loader>
    <app-table
      [data]="users"
      [currentPage]="pageNumber"
      [totalPages]="totalpages"
      [pageSize]="pageSize"
      [totalItems]="totalItems"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (delete)="deleteuser($event)"
      (edit)="edituser($event)"
    >
    </app-table>
  </div>
</div>
