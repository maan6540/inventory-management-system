<div class="sidebar bg-dark text-white d-flex flex-column" [class.collapsed]="isSidebarCollapsed">
  <!-- Navigation -->
  <div class="sidebar-navigation flex-grow-1 p-3">
    <ul class="nav nav-pills flex-column gap-2">
      @for (item of visibleSidebarItems(); track item.route) {
        <li class="nav-item">
          <a [routerLink]="item.route" class="nav-link text-white d-flex align-items-center">
            <i class="bi {{ item.icon }} fs-5"></i>
            @if (!isSidebarCollapsed) {
              <span class="ms-2">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </div>

  <!-- Collapse Button -->
  <div class="sidebar-footer p-3 border-top border-secondary">
    <button
      type="button"
      class="btn btn-dark w-100 d-flex align-items-center justify-content-center"
      [class.px-0]="isSidebarCollapsed"
      (click)="toggleSidebar()"
    >
      @if (isSidebarCollapsed) {
        <i class="bi bi-chevron-right"></i>
      } @else {
        <i class="bi bi-chevron-left me-2"></i>
        <span>Collapse Sidebar</span>
      }
    </button>
  </div>
</div>
