<div class="card border border-secondary-subtle shadow-sm rounded-3" style="height: 280px">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Low Stock Products</h5>

      <a href="#" class="text-decoration-none"> View All </a>
    </div>
    @for (lowstockproduct of lowestStockProducts; track $index) {
      <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
        <div class="d-flex align-items-center gap-2">
          <i class="fs-4 text-primary" [class]="getIcon(lowstockproduct.categoryName)"></i>

          <div>
            <div class="fw-semibold">{{ lowstockproduct.productName }}</div>

            <small class="text-muted">{{ lowstockproduct.categoryName }}</small>
          </div>
        </div>

        <span class="badge" [class]="getBadgeClass(lowstockproduct.quantity)">
          {{ lowstockproduct.quantity }} left
        </span>
      </div>
    }
  </div>
</div>
