<div class="card h-100 border border-secondary-subtle shadow-sm rounded-3">

  <div class="card-body p-3">

    <!-- Title + Icon -->
    <div class="d-flex align-items-center gap-2 mb-3">

      <i [class]="data.icon + ' fs-5 text-primary'"></i>

      <span class="fw-semibold text-muted">
        {{ data.title }}
      </span>

    </div>


    <!-- Value -->
    <h3 class="fw-bold mb-2">
      {{ data.value }}
    </h3>


    <!-- Percentage / Trend -->
    <span
      class="fw-semibold"
      [class.text-success]="data.percentage >= 0"
      [class.text-danger]="data.percentage < 0"
      [class.text-muted]="data.percentage==0">


      {{ data.percentage }}%

      @if (data.percentage > 0) {
        <i class="bi bi-arrow-up"></i>
      } @if(data.percentage<0) {
        <i class="bi bi-arrow-down"></i>
      }
      @if(data.percentage==0) {
        <i class="bi bi-dash"></i>
      }

    </span>

  </div>

</div>
