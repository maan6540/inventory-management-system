<div class="card border border-secondary-subtle shadow-sm rounded-3" style="height: 250px">
  <div class="card-body">
    <h5 class="fw-bold mb-3">Inventory Status</h5>

    <div class="d-flex justify-content-between align-items-center py-2">
      <span class="text-nowrap">
        <i class="bi bi-circle-fill text-success me-2"></i>
        In Stock
      </span>

      <strong>{{ inventoryStatus.inStockPercentage | percent }}</strong>
    </div>

    <div class="d-flex justify-content-between align-items-center py-2">
      <span class="text-nowrap">
        <i class="bi bi-circle-fill text-warning me-2"></i>
        Low Stock
      </span>

      <strong>{{ inventoryStatus.lowStockPercentage | percent }}</strong>
    </div>

    <div class="d-flex justify-content-between align-items-center py-2">
      <span class="text-nowrap">
        <i class="bi bi-circle-fill text-danger me-2"></i>
        Out Stock
      </span>

      <strong>{{ inventoryStatus.outStockPercentage | percent }}</strong>
    </div>
  </div>
</div>
