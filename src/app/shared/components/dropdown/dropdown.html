<div class="dropdown">

  <button
    class="btn border dropdown-toggle w-100 d-flex align-items-center justify-content-between"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false">

    <span class="text-truncate">
      {{ selectedOption ? selectedOption[labelKey] : placeholder }}
    </span>

  </button>


  <ul class="dropdown-menu w-100 dropdown-menu-scroll">

    @for (option of options; track option[valueKey]) {

      <li>

        <button
          type="button"
          class="dropdown-item text-truncate"
          (click)="onOptionSelected(option)">

          {{ option[labelKey] }}

        </button>

      </li>

    }

  </ul>

</div>
