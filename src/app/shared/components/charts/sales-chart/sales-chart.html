<div class="card border border-secondary-subtle shadow-sm rounded-3" style="height: 250px">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Sales Overview</h5>

      <select
        class="form-select form-select-sm w-auto"
        [(ngModel)]="selectedPeriod"
        (change)="loadSalesData()"
      >
        <option value="6months">Last 6 Months</option>

        <option value="month">Last Month</option>

        <option value="week">Last Week</option>
      </select>
    </div>

    <div style="height: 150px">
      <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType">
      </canvas>
    </div>
  </div>
</div>
